<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login">
{% from '_macros.html' import csrf %}
<form method="post" class="card login-box p-4">
  <p class="brand">Smart<span>Rent</span></p>
  <p class="text-secondary">Create a guest account to ask about units and request viewings.</p>
  {% for e in errors %}<div class="alert alert-danger py-2" role="alert">{{ e }}</div>{% endfor %}
  {{ csrf() }}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <label class="form-label">Full name <input class="form-control" name="name" required maxlength="100" autofocus value="{{ form.get('name', '') }}"></label>
  <label class="form-label">Email <input class="form-control" type="email" name="email" required value="{{ form.get('email', '') }}"></label>
  <label class="form-label">Password <input class="form-control" type="password" name="password" required minlength="{{ min_password }}" autocomplete="new-password"></label>
  <label class="form-label">Confirm password <input class="form-control" type="password" name="confirm" required minlength="{{ min_password }}" autocomplete="new-password"></label>
  <button class="btn btn-primary w-100 mt-2">Create account</button>
  <p class="mt-3 mb-0 small text-center">Already have an account? <a href="{{ url_for('auth.login', next=next) }}">Sign in</a>.
    <br><a href="{{ url_for('listings.index') }}">Browse units without an account</a></p>
</form>
</body>
</html>
