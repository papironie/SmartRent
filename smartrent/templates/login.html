<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login">
{% from '_macros.html' import csrf %}
<form method="post" class="card login-box p-4">
  <p class="brand">Smart<span>Rent</span></p>
  <p class="text-secondary">Properties, tenants, leases and billing in one place.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  {{ csrf() }}
  <label class="form-label">Email <input class="form-control" type="email" name="email" required autofocus value="{{ email }}"></label>
  <label class="form-label">Password <input class="form-control" type="password" name="password" required></label>
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button class="btn btn-primary w-100 mt-2">Sign in</button>
  <p class="mt-3 mb-0 small text-center">Looking for a place?
    <a href="{{ url_for('auth.register', next=next) }}">Create a guest account</a> or
    <a href="{{ url_for('listings.index') }}">browse units for rent</a>.</p>
</form>
</body>
</html>
